spring:
  application:
    name: bringme-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:bringme_api}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Pooler Supabase (Supavisor) : connexions recyclées avant que le pooler ou un NAT ne les coupe.
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 60000
      keepalive-time: 120000
      max-lifetime: 300000
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

bringme:
  web-url: ${WEB_URL:http://localhost:5173}
  pricing:
    base-cents: 300
    included-km: 2
    per-km-cents: 50
    commission-rate: ${COMMISSION_RATE:0.20}
    weight-tiers:
      - code: S
        label: Petit
        max-kg: 2
        surcharge-cents: 100
      - code: M
        label: Moyen
        max-kg: 5
        surcharge-cents: 300
      - code: L
        label: Lourd
        max-kg: 10
        surcharge-cents: 600
      - code: XL
        label: Très lourd
        max-kg: 30
        surcharge-cents: 1000
  supabase:
    url: ${SUPABASE_URL:https://wlmkpjurwvuhopllduqz.supabase.co}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:sb_publishable_-j9wOax_KdXbnST2ZA5dYQ_nDrGHWyj}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    api-version: ${STRIPE_API_VERSION:2025-12-15.clover}
    api-base: https://api.stripe.com
    webhook-tolerance-seconds: 300
    # Carte (Apple Pay / Google Pay inclus) ; ajouter paypal une fois activé dans le Dashboard Stripe.
    checkout-payment-methods: ${CHECKOUT_PAYMENT_METHODS:card}
  handover:
    max-attempts: 5
  geocoder:
    base-url: https://data.geopf.fr/geocodage
    min-score: 0.4

logging:
  level:
    app.bringme: INFO
