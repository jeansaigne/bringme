spring:
  application:
    name: bringme-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:bringme_api}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Pooler Supabase (Supavisor) : connexions recyclées avant que le pooler ou un NAT ne les coupe.
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 60000
      keepalive-time: 120000
      max-lifetime: 300000
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

bringme:
  web-url: ${WEB_URL:http://localhost:5173}
  pricing:
    included-km: 2
    commission-rate: ${COMMISSION_RATE:0.20}
    # Gabarit = véhicule requis. Calibrage : ~10 €/h net pour le coursier à vélo, ~13-15 €/h en voiture
    # (carburant déduit), toujours sous les tarifs des coursiers pros (Stuart Lille dès 7,50 € à vélo).
    size-tiers:
      - code: S
        label: Petit
        description: Jusqu'à 5 kg, tient dans un sac à dos (env. 50 × 35 × 25 cm)
        max-kg: 5
        max-length-cm: 50
        required-vehicle: FOOT_BIKE
        base-cents: 400
        per-km-cents: 80
      - code: M
        label: Moyen
        description: Jusqu'à 15 kg et moins de 1,50 m, tient dans un coffre
        max-kg: 15
        max-length-cm: 150
        required-vehicle: CAR
        base-cents: 600
        per-km-cents: 100
      - code: L
        label: Grand
        description: Jusqu'à 30 kg ou de 1,50 m à 2 m, banquette rabattue ou utilitaire
        max-kg: 30
        max-length-cm: 200
        required-vehicle: LARGE_CAR
        base-cents: 1200
        per-km-cents: 120
  supabase:
    url: ${SUPABASE_URL:https://wlmkpjurwvuhopllduqz.supabase.co}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:sb_publishable_-j9wOax_KdXbnST2ZA5dYQ_nDrGHWyj}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    api-version: ${STRIPE_API_VERSION:2025-12-15.clover}
    api-base: https://api.stripe.com
    webhook-tolerance-seconds: 300
    # Carte (Apple Pay / Google Pay inclus) ; ajouter paypal une fois activé dans le Dashboard Stripe.
    checkout-payment-methods: ${CHECKOUT_PAYMENT_METHODS:card}
  handover:
    max-attempts: 5
  geocoder:
    base-url: https://data.geopf.fr/geocodage
    min-score: 0.4

logging:
  level:
    app.bringme: INFO
